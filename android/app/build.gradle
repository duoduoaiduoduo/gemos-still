plugins { id 'com.android.application' }
android {
 namespace 'art.gemosdodo.still'
 compileSdk 35
 defaultConfig { applicationId 'art.gemosdodo.still.mobile'; minSdk 28; targetSdk 35; versionCode 6; versionName '0.6-original-research-preview'; testInstrumentationRunner 'art.gemosdodo.still.ViewerSmokeTest'; ndk { abiFilters 'arm64-v8a' } }
 signingConfigs { debug { storeFile file(System.getProperty("user.home") + "/.android/gemos-debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libgemos-*-probe.so'] } }
}
dependencies {
 implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'
 testImplementation 'junit:junit:4.13.2'
}
