name: Android experimental APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve experimental signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/gemos-debug.keystore
          key: gemos-android-mobile-signing-v1
      - name: Prepare explicit experimental keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/gemos-debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/gemos-debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname "CN=Gemos Still Experimental" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: gradle -p android assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gemos-Still-Android-experimental
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
